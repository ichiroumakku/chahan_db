<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャーハンデータベース</title>
<style>
  :root{
    --amber-50:#fffbeb; --amber-100:#fef3c7; --amber-200:#fde68a;
    --amber-500:#f59e0b; --amber-600:#d97706; --amber-700:#b45309;
    --ink:#3a2b1a; --sub:#8a7860; --line:#eadfc9;
    --green:#2f9e44; --red:#e03131;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(180deg,var(--amber-50),#fff);
    color:var(--ink); min-height:100vh;
  }
  header{
    background:linear-gradient(120deg,var(--amber-500),var(--amber-600));
    color:#fff; padding:28px 20px 22px; text-align:center;
    box-shadow:0 2px 10px rgba(180,83,9,.25);
  }
  header h1{margin:0; font-size:1.6em; letter-spacing:.02em;}
  header p{margin:6px 0 0; opacity:.92; font-size:.9em;}
  .wrap{max-width:920px; margin:0 auto; padding:20px 16px 60px;}

  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; margin-bottom:20px; box-shadow:0 1px 4px rgba(0,0,0,.04);
  }
  .card h2{margin:0 0 14px; font-size:1.05em; color:var(--amber-700); display:flex; align-items:center; gap:8px;}

  .stats{display:flex; gap:12px; flex-wrap:wrap;}
  .stat{
    flex:1; min-width:110px; background:var(--amber-50); border:1px solid var(--amber-200);
    border-radius:10px; padding:10px 14px; text-align:center;
  }
  .stat .num{font-size:1.4em; font-weight:700; color:var(--amber-700);}
  .stat .label{font-size:.78em; color:var(--sub); margin-top:2px;}

  form .row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
  form .field{flex:1; min-width:150px; display:flex; flex-direction:column; gap:4px;}
  form label{font-size:.8em; color:var(--sub); font-weight:600;}
  input[type=text], input[type=date], input[type=number], textarea{
    font-family:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    font-size:.95em; background:#fffefb;
  }
  textarea{resize:vertical; min-height:70px;}
  #fComment{min-height:160px;}
  .comment-counter{font-size:.75em; color:var(--sub); text-align:right; margin-top:4px;}
  input:focus, textarea:focus{outline:2px solid var(--amber-200); border-color:var(--amber-500);}

  .btn{
    border:none; border-radius:8px; padding:10px 18px; font-size:.92em; font-weight:600;
    cursor:pointer; transition:transform .05s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--amber-500); color:#fff;}
  .btn-primary:hover{background:var(--amber-600);}
  .btn-ghost{background:transparent; color:var(--sub); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--amber-50);}
  .btn-danger{background:#fff; color:var(--red); border:1px solid #ffd0d0;}
  .btn-danger:hover{background:#fff5f5;}
  .btn-small{padding:5px 10px; font-size:.8em;}

  select{padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:.9em; background:#fffefb;}

  .store-card{
    border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:16px;
    background:#fffefc;
  }
  .store-header{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    margin-bottom:12px; padding-bottom:12px; border-bottom:1px dashed var(--line);
  }
  .store-name{font-weight:800; font-size:1.15em;}
  .store-no{
    display:inline-block; background:var(--amber-600); color:#fff; font-size:.7em;
    font-weight:700; padding:2px 7px; border-radius:6px; margin-right:8px; vertical-align:middle;
    letter-spacing:.02em;
  }
  .store-meta{font-size:.8em; color:var(--sub); margin-top:2px;}
  .store-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .tabelog-link{
    display:inline-block; background:#fff2e0; color:var(--amber-700); font-size:.72em;
    padding:2px 8px; border-radius:999px; margin-left:8px; font-weight:600; vertical-align:middle;
    border:1px solid var(--amber-200); text-decoration:none;
  }
  .tabelog-link:hover{background:var(--amber-100);}

  .visit-list{display:flex; flex-direction:column; gap:10px;}
  .visit-card{border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:#fff;}
  .visit-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .visit-date{font-weight:700; font-size:.95em;}
  .visit-menu{font-size:.88em; color:var(--amber-700); margin-top:4px; font-weight:600;}
  .score{font-size:1.4em; font-weight:800; color:var(--amber-700); min-width:60px; text-align:right;}

  .entry-comment-list{margin:8px 0 2px; padding-left:20px; font-size:.9em; line-height:1.7;}
  .entry-actions{margin-top:10px; display:flex; gap:8px;}
  .rating-badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .rating-badge{
    display:inline-block; background:var(--amber-50); color:var(--amber-700); font-size:.72em;
    padding:2px 8px; border-radius:999px; border:1px solid var(--amber-200); font-weight:600;
  }
  .entry-comment{margin:8px 0 2px; font-size:.9em; line-height:1.7; white-space:pre-wrap;}

  .empty{text-align:center; color:var(--sub); padding:30px 10px; font-size:.9em;}

  .footer-actions{display:flex; gap:10px; justify-content:center; margin-top:8px; flex-wrap:wrap;}
  #importFile{display:none;}

  dialog{
    border:none; border-radius:14px; padding:0; max-width:420px; width:90%;
    box-shadow:0 10px 40px rgba(0,0,0,.2);
  }
  dialog::backdrop{background:rgba(58,43,26,.35);}
  .dialog-inner{padding:20px 22px;}
  .dialog-inner h3{margin:0 0 12px; color:var(--amber-700);}
  .dialog-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
</style>
</head>
<body>

<header>
  <h1>🍚 チャーハンデータベース</h1>
  <p>色々な店のチャーハンを記録・採点するアプリ</p>
</header>

<div class="wrap">

  <div class="card">
    <h2>📊 サマリー</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="statStores">0</div><div class="label">店舗数</div></div>
      <div class="stat"><div class="num" id="statCount">0</div><div class="label">来店記録数</div></div>
      <div class="stat"><div class="num" id="statAvg">-</div><div class="label">平均点</div></div>
      <div class="stat"><div class="num" id="statMax">-</div><div class="label">最高点</div></div>
      <div class="stat"><div class="num" id="statMin">-</div><div class="label">最低点</div></div>
    </div>
  </div>

  <div class="card">
    <h2 id="formTitle">✏️ 来店記録を追加</h2>
    <form id="entryForm">
      <input type="hidden" id="editStoreId">
      <input type="hidden" id="editVisitId">
      <div class="row">
        <div class="field" style="flex:0 0 300px; width:300px;">
          <label>店名 *（既存店は入力すると検索できます）</label>
          <input type="text" id="fName" list="storeNameList" required placeholder="例）華勝園" style="width:100%;">
          <datalist id="storeNameList"></datalist>
        </div>
      </div>
      <div class="row">
        <div class="field" style="flex:1 1 0;">
          <label>エリア・最寄駅</label>
          <input type="text" id="fArea" placeholder="例）馬込沢" style="width:100%;">
        </div>
        <div class="field" style="flex:1 1 0;">
          <label>食べログURL</label>
          <input type="text" id="fTabelogUrl" placeholder="例）https://tabelog.com/tokyo/..." style="width:100%;">
        </div>
      </div>
      <div class="row">
        <div class="field" style="max-width:180px;">
          <label>訪問日</label>
          <input type="date" id="fDate">
        </div>
        <div class="field">
          <label>注文したメニュー</label>
          <input type="text" id="fMenu" placeholder="例）えびチャーハン">
        </div>
        <div class="field" style="max-width:160px;">
          <label>点数（0.00〜9.99）</label>
          <input type="number" id="fScore" step="0.01" min="0" max="9.99" placeholder="例）5.00">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>米</label>
          <select id="fRatingKome">
            <option value="">選択してください</option>
            <option value="5">5：とても良い</option>
            <option value="4">4：良い</option>
            <option value="3">3：普通</option>
            <option value="2">2：もう一歩</option>
            <option value="1">1：イマイチ</option>
          </select>
        </div>
        <div class="field">
          <label>塩</label>
          <select id="fRatingEnbun">
            <option value="">選択してください</option>
            <option value="5">5：とても良い</option>
            <option value="4">4：良い</option>
            <option value="3">3：普通</option>
            <option value="2">2：もう一歩</option>
            <option value="1">1：イマイチ</option>
          </select>
        </div>
        <div class="field">
          <label>油</label>
          <select id="fRatingAbura">
            <option value="">選択してください</option>
            <option value="5">5：とても良い</option>
            <option value="4">4：良い</option>
            <option value="3">3：普通</option>
            <option value="2">2：もう一歩</option>
            <option value="1">1：イマイチ</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>コメント（自由記入、最大200文字）</label>
          <textarea id="fComment" maxlength="200" placeholder="例）パラパラ感が強く、卵の香りが良い。"></textarea>
          <div class="comment-counter"><span id="commentCount">0</span>/200文字</div>
        </div>
      </div>
      <div class="row" style="margin-bottom:0;">
        <button type="submit" class="btn btn-primary">保存する</button>
        <button type="button" class="btn btn-ghost" id="cancelEdit" style="display:none;">編集をキャンセル</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>🔍 検索条件</h2>
    <div class="row">
      <div class="field" style="flex:2;">
        <label>キーワード（店名・エリア・メニュー・コメント）</label>
        <input type="text" id="searchBox" placeholder="例）華勝園">
      </div>
      <div class="field" style="flex:0 0 100px; width:100px;">
        <label>点数（下限）</label>
        <input type="number" id="searchScoreMin" step="0.01" min="0" max="9.99" placeholder="例）4.90" style="width:100%;">
      </div>
      <div class="field" style="flex:0 0 100px; width:100px;">
        <label>点数（上限）</label>
        <input type="number" id="searchScoreMax" step="0.01" min="0" max="9.99" placeholder="例）5.10" style="width:100%;">
      </div>
    </div>
    <div class="row">
      <div class="field" style="max-width:180px;">
        <label>訪問日</label>
        <input type="date" id="searchDate">
      </div>
      <div class="field" style="max-width:200px;">
        <label>並び順</label>
        <select id="sortSelect">
          <option value="score_desc">点数が高い順</option>
          <option value="score_asc">点数が低い順</option>
          <option value="date_desc">訪問日が新しい順</option>
          <option value="date_asc">訪問日が古い順</option>
          <option value="name_asc">店名順</option>
        </select>
      </div>
    </div>
    <div class="row" style="margin-bottom:0;">
      <button type="button" class="btn btn-primary" id="searchBtn">検索</button>
      <button type="button" class="btn btn-ghost" id="clearSearchBtn">検索条件をクリア</button>
    </div>
  </div>

  <div class="card">
    <h2>📋 記録一覧</h2>
    <div id="list"></div>
    <div class="footer-actions">
      <button class="btn btn-ghost btn-small" id="exportBtn">📤 JSONで書き出し</button>
      <button class="btn btn-ghost btn-small" id="importBtn">📥 JSONを読み込み</button>
      <input type="file" id="importFile" accept="application/json">
      <button class="btn btn-ghost btn-small" id="exportCsvBtn">📄 CSVで書き出し</button>
    </div>
  </div>

</div>

<dialog id="confirmDialog">
  <div class="dialog-inner">
    <h3>削除の確認</h3>
    <p id="confirmMsg" style="font-size:.9em; color:var(--sub);">この記録を削除しますか？この操作は取り消せません。</p>
    <div class="dialog-actions">
      <button class="btn btn-ghost btn-small" id="confirmCancel">キャンセル</button>
      <button class="btn btn-danger btn-small" id="confirmOk">削除する</button>
    </div>
  </div>
</dialog>

<script>
const STORAGE_KEY = 'stores';
const RATING_LABELS = {1:'イマイチ', 2:'もう一歩', 3:'普通', 4:'良い', 5:'とても良い'};
const RATING_ITEMS = [
  {key:'kome', selectId:'fRatingKome', label:'米'},
  {key:'enbun', selectId:'fRatingEnbun', label:'塩'},
  {key:'abura', selectId:'fRatingAbura', label:'油'}
];

// 事前登録データ（チャーハンランキング移行データより）

let stores = [];
let pendingAction = null;
let activeFilter = { keyword:'', scoreMin:'', scoreMax:'', date:'' };
let dataReady = false;

function uid(){
  return 'id' + Date.now() + Math.random().toString(36).slice(2,7);
}

function nextStoreNo(){
  let maxNo = 0;
  stores.forEach(s => {
    const n = Number(s.no);
    if(!isNaN(n) && n > maxNo) maxNo = n;
  });
  return maxNo + 1;
}

const LOCAL_FALLBACK_KEY = 'chahan_stores_local_v1';
const hasCloudStorage = (typeof window !== 'undefined' && !!window.storage);

// window.storage（永続ストレージ）が使える環境ではそちらを使い、
// 使えない・失敗する環境では自動的にブラウザのlocalStorageにフォールバックする。
async function storageGetRaw(){
  if(hasCloudStorage){
    try{
      const result = await window.storage.get(STORAGE_KEY, false);
      if(result && typeof result.value === 'string') return result.value;
      return null;
    }catch(err){
      // クラウド側で未作成/失敗 → localStorageを試す
    }
  }
  try{
    return localStorage.getItem(LOCAL_FALLBACK_KEY);
  }catch(err){
    return null;
  }
}

async function storageSetRaw(value){
  let ok = false;
  if(hasCloudStorage){
    try{
      const result = await window.storage.set(STORAGE_KEY, value, false);
      ok = !!result;
    }catch(err){
      ok = false;
    }
  }
  // クラウド保存に失敗した場合、またはクラウドが使えない場合はlocalStorageに保存
  if(!ok){
    try{
      localStorage.setItem(LOCAL_FALLBACK_KEY, value);
      ok = true;
    }catch(err){
      ok = false;
    }
  }
  return ok;
}

async function loadStores(){
  const listEl = document.getElementById('list');
  if(listEl) listEl.innerHTML = '<div class="empty">読み込み中...</div>';
  try{
    const raw = await storageGetRaw();
    if(raw){
      stores = JSON.parse(raw);
    } else {
      // 初回：移行データを事前登録
      stores = JSON.parse(JSON.stringify(MIGRATED_STORES));
      await saveStores();
    }
  }catch(err){
    console.error('データの読み込みに失敗しました', err);
    stores = JSON.parse(JSON.stringify(MIGRATED_STORES));
  }
  dataReady = true;
}

async function saveStores(){
  try{
    const ok = await storageSetRaw(JSON.stringify(stores));
    if(!ok){
      console.error('保存に失敗しました');
    }
  }catch(err){
    console.error('保存エラー', err);
  }
}

function fmtScore(n){
  return Number(n).toFixed(2);
}
function fmtDate(d){
  if(!d) return '訪問日未記入';
  return d;
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 旧バージョン(箇条書きコメント配列)との互換用
function getVisitComment(visit){
  if(visit.comment !== undefined && visit.comment !== null) return visit.comment;
  if(Array.isArray(visit.comments)) return visit.comments.join('\n');
  return '';
}

// 点数フォーマット検証: 整数一桁 + 小数点以下2桁 (0.00〜9.99)
function isValidScore(v){
  if(v === '' || v === null || v === undefined) return true; // 未入力は許容
  return /^\d(\.\d{1,2})?$/.test(String(v)) && Number(v) <= 9.99 && Number(v) >= 0;
}

function render(){
  refreshStoreNameList();
  renderStats();
  renderList();
}

function refreshStoreNameList(){
  const dl = document.getElementById('storeNameList');
  dl.innerHTML = stores.map(s => `<option value="${escapeHtml(s.name)}"></option>`).join('');
}

function findStoreByName(name){
  const key = (name || '').trim().toLowerCase();
  if(!key) return null;
  return stores.find(s => s.name.trim().toLowerCase() === key) || null;
}

function renderStats(){
  const allVisits = stores.flatMap(s => s.visits || []);
  document.getElementById('statStores').textContent = stores.length;
  document.getElementById('statCount').textContent = allVisits.length;
  const scores = allVisits.map(v => Number(v.score)).filter(n => !isNaN(n));
  if(scores.length === 0){
    document.getElementById('statAvg').textContent = '-';
    document.getElementById('statMax').textContent = '-';
    document.getElementById('statMin').textContent = '-';
    return;
  }
  const avg = scores.reduce((a,b)=>a+b,0) / scores.length;
  document.getElementById('statAvg').textContent = fmtScore(avg);
  document.getElementById('statMax').textContent = fmtScore(Math.max(...scores));
  document.getElementById('statMin').textContent = fmtScore(Math.min(...scores));
}

function visitMatches(store, visit){
  if(activeFilter.keyword){
    const hay = [store.name, store.area, visit.menu, getVisitComment(visit)];
    const hit = hay.some(v => (v||'').toLowerCase().includes(activeFilter.keyword));
    if(!hit) return false;
  }
  const score = Number(visit.score);
  if(activeFilter.scoreMin !== '' && !isNaN(Number(activeFilter.scoreMin))){
    if(isNaN(score) || score < Number(activeFilter.scoreMin)) return false;
  }
  if(activeFilter.scoreMax !== '' && !isNaN(Number(activeFilter.scoreMax))){
    if(isNaN(score) || score > Number(activeFilter.scoreMax)) return false;
  }
  if(activeFilter.date){
    if(visit.date !== activeFilter.date) return false;
  }
  return true;
}

function bestScore(visits){ const s = visits.map(v=>Number(v.score)).filter(n=>!isNaN(n)); return s.length ? Math.max(...s) : -Infinity; }
function worstScore(visits){ const s = visits.map(v=>Number(v.score)).filter(n=>!isNaN(n)); return s.length ? Math.min(...s) : Infinity; }
function latestDate(visits){ const d = visits.map(v=>v.date).filter(Boolean).sort(); return d.length ? d[d.length-1] : ''; }
function earliestDate(visits){ const d = visits.map(v=>v.date).filter(Boolean).sort(); return d.length ? d[0] : ''; }

function renderList(){
  const listEl = document.getElementById('list');
  const sortMode = document.getElementById('sortSelect').value;

  let groups = stores.map(store => {
    const visits = (store.visits || []).filter(v => visitMatches(store, v));
    return { store, visits };
  }).filter(g => g.visits.length > 0);

  groups.forEach(g => {
    g.visits.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  });

  groups.sort((a,b) => {
    switch(sortMode){
      case 'score_asc': return worstScore(a.visits) - worstScore(b.visits);
      case 'date_desc': return latestDate(b.visits).localeCompare(latestDate(a.visits));
      case 'date_asc': return earliestDate(a.visits).localeCompare(earliestDate(b.visits));
      case 'name_asc': return (a.store.name||'').localeCompare(b.store.name||'', 'ja');
      default: return bestScore(b.visits) - bestScore(a.visits);
    }
  });

  if(groups.length === 0){
    listEl.innerHTML = '<div class="empty">まだ記録がありません。上のフォームから追加してください。</div>';
    return;
  }

  listEl.innerHTML = groups.map(g => storeCardHtml(g.store, g.visits)).join('');
}

function fmtStoreNo(no){
  const n = Number(no);
  if(!no || isNaN(n)) return '';
  return String(n).padStart(3, '0');
}

function storeCardHtml(store, visits){
  const tabelogLink = store.tabelogUrl
    ? `<a class="tabelog-link" href="${escapeHtml(store.tabelogUrl)}" target="_blank" rel="noopener">食べログを開く</a>`
    : '';
  const noLabel = fmtStoreNo(store.no);
  const noBadge = noLabel ? `<span class="store-no">No.${noLabel}</span>` : '';
  return `
  <div class="store-card">
    <div class="store-header">
      <div>
        <div class="store-name">${noBadge}${escapeHtml(store.name)}${tabelogLink}</div>
        <div class="store-meta">${escapeHtml(store.area || '')}</div>
      </div>
      <div class="store-actions">
        <button class="btn btn-ghost btn-small" onclick="addVisitToStore('${store.id}')">来店記録を追加</button>
        <button class="btn btn-danger btn-small" onclick="askDeleteStore('${store.id}')">店舗を削除</button>
      </div>
    </div>
    <div class="visit-list">
      ${visits.map(v => visitCardHtml(store, v)).join('')}
    </div>
  </div>
  `;
}

function visitCardHtml(store, visit){
  const badges = RATING_ITEMS.map(r => {
    const v = visit.rating && visit.rating[r.key];
    if(!v) return '';
    return `<span class="rating-badge">${r.label}: ${RATING_LABELS[v]}</span>`;
  }).join('');
  const comment = getVisitComment(visit);
  return `
  <div class="visit-card">
    <div class="visit-top">
      <div class="visit-date">${fmtDate(visit.date)}</div>
      <div class="score">${isNaN(Number(visit.score)) ? '-' : fmtScore(visit.score)}</div>
    </div>
    ${visit.menu ? `<div class="visit-menu">${escapeHtml(visit.menu)}</div>` : ''}
    ${badges ? `<div class="rating-badges">${badges}</div>` : ''}
    ${comment ? `<div class="entry-comment">${escapeHtml(comment)}</div>` : ''}
    <div class="entry-actions">
      <button class="btn btn-ghost btn-small" onclick="startEditVisit('${store.id}','${visit.id}')">編集</button>
      <button class="btn btn-danger btn-small" onclick="askDeleteVisit('${store.id}','${visit.id}')">削除</button>
    </div>
  </div>
  `;
}

}

function updateCommentCount(){
  document.getElementById('commentCount').textContent = document.getElementById('fComment').value.length;
}
document.getElementById('fComment').addEventListener('input', updateCommentCount);

document.getElementById('fName').addEventListener('input', (ev) => {
  if(document.getElementById('editStoreId').value) return; // 編集中は自動入力しない
  const s = findStoreByName(ev.target.value);
  if(s){
    document.getElementById('fArea').value = s.area || '';
    document.getElementById('fTabelogUrl').value = s.tabelogUrl || '';
  }
});

document.getElementById('entryForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const editStoreId = document.getElementById('editStoreId').value;
  const editVisitId = document.getElementById('editVisitId').value;
  const scoreRaw = document.getElementById('fScore').value.trim();

  if(!isValidScore(scoreRaw)){
    alert('点数は 0.00〜9.99 の範囲で、整数一桁・小数点以下2桁までで入力してください（例: 5.00）。');
    return;
  }
  const scoreVal = scoreRaw === '' ? '' : Math.round(parseFloat(scoreRaw) * 100) / 100;

  const rating = {};
  RATING_ITEMS.forEach(r => {
    const v = document.getElementById(r.selectId).value;
    rating[r.key] = v === '' ? '' : Number(v);
  });

  const name = document.getElementById('fName').value.trim();
  const area = document.getElementById('fArea').value.trim();
  const tabelogUrl = document.getElementById('fTabelogUrl').value.trim();
  if(!name){ return; }

  let store = null;
  if(editStoreId){
    store = stores.find(s => s.id === editStoreId);
  } else {
    store = findStoreByName(name);
  }
  if(!store){
    store = { id: uid(), no: nextStoreNo(), name, area, tabelogUrl, visits: [] };
    stores.push(store);
  } else {
    store.name = name;
    store.area = area;
    store.tabelogUrl = tabelogUrl;
  }

  const visit = {
    id: editVisitId || uid(),
    date: document.getElementById('fDate').value,
    menu: document.getElementById('fMenu').value.trim(),
    score: scoreVal,
    rating: rating,
    comment: document.getElementById('fComment').value.trim().slice(0, 200)
  };

  if(editVisitId){
    const vidx = store.visits.findIndex(v => v.id === editVisitId);
    if(vidx >= 0) store.visits[vidx] = visit; else store.visits.push(visit);
  } else {
    store.visits.push(visit);
  }

  await saveStores();
  resetForm();
  render();
});

function resetForm(){
  document.getElementById('editStoreId').value = '';
  document.getElementById('editVisitId').value = '';
  document.getElementById('entryForm').reset();
  document.getElementById('formTitle').textContent = '✏️ 来店記録を追加';
  document.getElementById('cancelEdit').style.display = 'none';
  updateCommentCount();
}

function startEditVisit(storeId, visitId){
  const store = stores.find(s => s.id === storeId);
  if(!store) return;
  const visit = store.visits.find(v => v.id === visitId);
  if(!visit) return;

  document.getElementById('editStoreId').value = storeId;
  document.getElementById('editVisitId').value = visitId;
  document.getElementById('fName').value = store.name || '';
  document.getElementById('fArea').value = store.area || '';
  document.getElementById('fTabelogUrl').value = store.tabelogUrl || '';
  document.getElementById('fDate').value = visit.date || '';
  document.getElementById('fMenu').value = visit.menu || '';
  document.getElementById('fScore').value = visit.score;
  RATING_ITEMS.forEach(r => {
    const v = (visit.rating && visit.rating[r.key]) ?? '';
    document.getElementById(r.selectId).value = v;
  });
  document.getElementById('fComment').value = getVisitComment(visit);
  updateCommentCount();
  document.getElementById('formTitle').textContent = '✏️ 来店記録を編集';
  document.getElementById('cancelEdit').style.display = 'inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function addVisitToStore(storeId){
  const store = stores.find(s => s.id === storeId);
  if(!store) return;
  document.getElementById('editStoreId').value = '';
  document.getElementById('editVisitId').value = '';
  document.getElementById('fName').value = store.name || '';
  document.getElementById('fArea').value = store.area || '';
  document.getElementById('fTabelogUrl').value = store.tabelogUrl || '';
  document.getElementById('fDate').value = '';
  document.getElementById('fMenu').value = '';
  document.getElementById('fScore').value = '';
  RATING_ITEMS.forEach(r => { document.getElementById(r.selectId).value = ''; });
  document.getElementById('fComment').value = '';
  updateCommentCount();
  document.getElementById('formTitle').textContent = '✏️ 来店記録を追加';
  document.getElementById('cancelEdit').style.display = 'none';
  window.scrollTo({top:0, behavior:'smooth'});
  document.getElementById('fDate').focus();
}

document.getElementById('cancelEdit').addEventListener('click', resetForm);

function askDeleteVisit(storeId, visitId){
  pendingAction = {type:'visit', storeId, visitId};
  document.getElementById('confirmMsg').textContent = 'この来店記録を削除しますか？この操作は取り消せません。';
  document.getElementById('confirmDialog').showModal();
}
function askDeleteStore(storeId){
  pendingAction = {type:'store', storeId};
  document.getElementById('confirmMsg').textContent = 'この店舗とすべての来店記録を削除しますか？この操作は取り消せません。';
  document.getElementById('confirmDialog').showModal();
}
document.getElementById('confirmCancel').addEventListener('click', () => {
  pendingAction = null;
  document.getElementById('confirmDialog').close();
});
document.getElementById('confirmOk').addEventListener('click', async () => {
  if(pendingAction){
    if(pendingAction.type === 'visit'){
      const store = stores.find(s => s.id === pendingAction.storeId);
      if(store){
        store.visits = store.visits.filter(v => v.id !== pendingAction.visitId);
        if(store.visits.length === 0){
          stores = stores.filter(s => s.id !== store.id);
        }
      }
    } else if(pendingAction.type === 'store'){
      stores = stores.filter(s => s.id !== pendingAction.storeId);
    }
    await saveStores();
    render();
  }
  pendingAction = null;
  document.getElementById('confirmDialog').close();
});

document.getElementById('searchBtn').addEventListener('click', performSearch);
document.getElementById('clearSearchBtn').addEventListener('click', clearSearch);
['searchBox','searchScoreMin','searchScoreMax','searchDate'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (ev) => {
    if(ev.key === 'Enter'){
      ev.preventDefault();
      performSearch();
    }
  });
});
document.getElementById('sortSelect').addEventListener('change', renderList);

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(stores, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'chahan_stores.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('exportCsvBtn').addEventListener('click', () => {
  const header = ['店番号','店名','エリア','訪問日','メニュー','点数','米','塩','油','食べログURL','コメント'];
  const rows = [];
  stores.forEach(s => {
    (s.visits || []).forEach(v => {
      rows.push([
        fmtStoreNo(s.no), s.name, s.area, v.date, v.menu, v.score,
        (v.rating && v.rating.kome) ? RATING_LABELS[v.rating.kome] : '',
        (v.rating && v.rating.enbun) ? RATING_LABELS[v.rating.enbun] : '',
        (v.rating && v.rating.abura) ? RATING_LABELS[v.rating.abura] : '',
        s.tabelogUrl,
        getVisitComment(v)
      ]);
    });
  });
  const csv = [header, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["﻿" + csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'chahan_stores.csv';
  a.click();
  URL.revokeObjectURL(url);
});

function normalizeImportedStores(data){
  if(!Array.isArray(data)) throw new Error('invalid');
  if(data.length && Array.isArray(data[0].visits)){
    return data.map(s => ({
      id: uid(),
      no: s.no ?? '',
      name: s.name || '',
      area: s.area || '',
      tabelogUrl: s.tabelogUrl ?? '',
      visits: (s.visits || []).map(v => ({
        id: uid(),
        date: v.date || '',
        menu: v.menu || '',
        score: v.score,
        rating: v.rating || {},
        comment: Array.isArray(v.comments) ? v.comments.join('\n') : (v.comment || '')
      }))
    }));
  }
  const map = {};
  data.forEach(e => {
    const key = (e.name||'').trim().toLowerCase() + '||' + (e.area||'').trim().toLowerCase();
    if(!map[key]){
      map[key] = { id: uid(), name: e.name || '', area: e.area || '', tabelogUrl: e.tabelogUrl || '', visits: [] };
    }
    map[key].visits.push({
      id: uid(),
      date: e.date || '',
      menu: e.menu || '',
      score: e.score,
      rating: e.rating || {},
      comment: Array.isArray(e.comments) ? e.comments.join('\n') : (e.comment || '')
    });
  });
  return Object.values(map);
}

function mergeImportedStores(imported){
  let count = 0;
  imported.forEach(s => {
    const existing = stores.find(st => st.name.trim().toLowerCase() === s.name.trim().toLowerCase());
    if(existing){
      if(!existing.area && s.area) existing.area = s.area;
      if(!existing.tabelogUrl && s.tabelogUrl) existing.tabelogUrl = s.tabelogUrl;
      existing.visits = existing.visits.concat(s.visits);
      count += s.visits.length;
    } else {
      if(s.no === '' || s.no === undefined || s.no === null || isNaN(Number(s.no))){
        s.no = nextStoreNo();
      }
      stores.push(s);
      count += s.visits.length;
    }
  });
  return count;
}

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      const imported = normalizeImportedStores(data);
      const count = mergeImportedStores(imported);
      await saveStores();
      render();
      alert('読み込みが完了しました（' + count + '件の来店記録を追加）。');
    }catch(e){
      alert('読み込みに失敗しました。正しいJSONファイルか確認してください。');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
});

// ショートカット連携: URLに ?tabelogUrl=... を付けて開くと食べログURL欄に自動入力
function applyUrlParams(){
  try{
    const params = new URLSearchParams(window.location.search);
    const tabelogUrl = params.get('tabelogUrl');
    if(tabelogUrl){
      document.getElementById('fTabelogUrl').value = decodeURIComponent(tabelogUrl);
      document.getElementById('fName').focus();
      window.scrollTo({top:0, behavior:'smooth'});
      if(window.history && window.history.replaceState){
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }
  }catch(e){}
}

(async function init(){
  await loadStores();
  updateCommentCount();
  render();
  applyUrlParams();
})();
</script>
